<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>원고지 편집기</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#B01E23">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="원고지">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  /* 입력칸에만 씌우는 글꼴. 모든 글자의 폭이 정확히 한 칸이어서, 브라우저가 글자를
     원고지 칸과 같은 격자에 배치한다. 글리프는 비어 있어 아무것도 그리지 않는다. */
  @font-face { font-family: "tl-grid"; src: url("fonts/tl-grid.woff2") format("woff2");
    font-display: block; }
  :root { --bar: #f2f2f2; --line: #d6d6d6; --ink: #222; --rule: #b01e23; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; background: #808080; color: var(--ink);
    font: 14px/1.4 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    overflow: hidden; -webkit-text-size-adjust: 100%;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center;
    padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top));
    background: var(--bar); border-bottom: 1px solid var(--line);
  }
  button, select { font: inherit; padding: 6px 10px; border: 1px solid var(--line);
    border-radius: 7px; background: #fff; color: inherit; }
  .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 2px; }
  /* 글꼴 받는 진행률: 고른 글꼴 바로 아래에 얇게 */
  .fontpick { position: relative; display: inline-flex; }
  #progress { position: absolute; left: 4px; right: 4px; bottom: -5px; height: 3px;
    border-radius: 2px; background: #00000014; overflow: hidden; }
  #progressBar { display: block; height: 100%; width: 0; background: var(--rule);
    transition: width 0.15s linear; }
  #progress.unknown #progressBar { width: 40%; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -40% } 100% { margin-left: 100% } }
  /* 놓치면 안 되는 문제는 도구 모음 바로 아래에 띠로 */
  #banner { display: flex; gap: 10px; align-items: flex-start; padding: 8px 12px;
    background: #fdecec; color: #7d1a1e; border-bottom: 1px solid #f0c9ca; font-size: 13px; }
  #banner[hidden] { display: none; }
  #bannerText { flex: 1; }
  #bannerClose { border: 0; background: transparent; color: inherit; font-size: 18px;
    line-height: 1; padding: 0 4px; }
  /* 저장된 글꼴 칸 3개를 점으로 보여 주는 아이콘 */
  #fontCache { display: flex; gap: 3px; align-items: center; padding: 8px; }
  #fontCache .slot { width: 8px; height: 8px; border-radius: 2px; border: 1px solid #aaa; }
  #fontCache .slot.on { background: var(--ink); border-color: var(--ink); }
  button:active { background: #e6e6e6; }
  button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  label { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  input[type=text] { font: inherit; padding: 6px 8px; width: 7em; border: 1px solid var(--line);
    border-radius: 7px; background: #fff; color: inherit; }
  input[type=range] { width: 120px; }
  main { flex: 1; display: grid; place-items: center; padding: 10px; min-height: 0; }
  /* 손가락은 화면 밀기·손가락 확대에 쓰고, 마우스로만 끌어서 선택한다 (app.js) */
  #paper { max-width: 100%; max-height: 100%; background: #fff; box-shadow: 0 2px 12px #0004;
    touch-action: manipulation; }
  /* 선택 모드에서는 손가락으로 끌어도 화면이 밀리지 않고 글자가 선택된다 */
  #paper.selecting { touch-action: none; }
  footer { padding: 6px 12px; padding-bottom: max(6px, env(safe-area-inset-bottom));
    background: var(--bar); border-top: 1px solid var(--line); min-height: 30px;
    font-size: 13px; color: #444; }
  /* 글이 실제로 담기는 곳. 종이 위에 격자를 맞춰 덮어 두고 글자는 투명하게 둔다.
     커서·선택·복사 풍선·키보드·받아쓰기를 기기가 원래 하던 방식대로 쓰기 위한 것이다.
     위치·크기·회전은 app.js의 placeIme()가 종이와 같은 변환으로 맞춘다. */
  #ime {
    position: fixed; left: 0; top: 0; transform-origin: 0 0;
    margin: 0; padding: 0; border: 0; outline: none; resize: none; overflow: hidden;
    background: transparent; color: transparent; -webkit-text-fill-color: transparent;
    caret-color: var(--ink); z-index: 2;
    font-family: "tl-grid"; letter-spacing: 0; font-kerning: none;
    font-variant-ligatures: none; tab-size: 1;
    /* 칸을 차지하는 공백까지 원고지와 똑같이 줄바꿈시키는 조합 */
    white-space: break-spaces; word-break: break-all; line-break: anywhere;
    overflow-wrap: anywhere;
  }
  #ime::selection { background: rgba(80, 140, 255, 0.35); }
  #file { display: none; }
  @media print {
    /* A4 세로 한 장. 배율 100%·여백 없음이면 칸이 도면 치수대로 나온다. */
    @page { size: A4 portrait; margin: 0; }
    html, body { width: 100%; height: 100%; margin: 0; background: #fff; overflow: hidden; }
    header, footer, #banner, #ime { display: none !important; }
    main { display: block; width: 100%; height: 100%; padding: 0; }
    /* 종이 크기를 mm로 못 박지 않고 인쇄 영역을 꽉 채운다. 용지가 A4면 210×297mm
       그대로이고, Letter처럼 A4보다 짧은 용지에서는 비율을 지키며 줄어들어 한 장에
       들어간다 (두 장으로 넘치지 않는다). */
    #paper { display: block; width: 100%; height: 100%;
      max-width: 100%; max-height: 100%; box-shadow: none; }
  }
</style>
</head>
<body>
<header>
  <label>이름 <input id="name" type="text" value="편지" maxlength="40"
    title="저장·인쇄할 때 쓰는 파일 이름"></label>
  <button id="open">불러오기</button>
  <button id="save">저장</button>
  <button id="print">인쇄 · PDF</button>
  <span class="sep"></span>
  <label>용지 <select id="form" title="인쇄 형식"></select></label>
  <button id="vertical" aria-pressed="false">세로쓰기</button>
  <span class="fontpick">
    <select id="font"></select>
    <span id="progress" hidden><i id="progressBar"></i></span>
  </span>
  <button id="fontCache" title="저장된 글꼴 (최대 3개)" aria-label="저장된 글꼴">
    <span class="slot"></span><span class="slot"></span><span class="slot"></span>
  </button>
  <label>글자 크기 <input id="size" type="range" min="40" max="100" step="1"><span id="sizeValue">80%</span></label>
</header>
<div id="banner" hidden role="alert">
  <span id="bannerText"></span>
  <button id="bannerClose" aria-label="닫기">×</button>
</div>
<main>
  <svg id="paper" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297"></svg>
</main>
<footer id="status">준비</footer>
<textarea id="ime" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"
  inputmode="text" enterkeyhint="enter"></textarea>
<input id="file" type="file" accept=".txt,text/plain">
<script type="module" src="app.js"></script>
</body>
</html>
