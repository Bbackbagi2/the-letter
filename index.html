<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>원고지 편집기</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#B01E23">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="원고지">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root { --bar: #f2f2f2; --line: #d6d6d6; --ink: #222; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; background: #808080; color: var(--ink);
    font: 14px/1.4 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    overflow: hidden; -webkit-text-size-adjust: 100%;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center;
    padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top));
    background: var(--bar); border-bottom: 1px solid var(--line);
  }
  button, select { font: inherit; padding: 6px 10px; border: 1px solid var(--line);
    border-radius: 7px; background: #fff; color: inherit; }
  .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 2px; }
  /* 저장된 글꼴 칸 3개를 점으로 보여 주는 아이콘 */
  #fontCache { display: flex; gap: 3px; align-items: center; padding: 8px; }
  #fontCache .slot { width: 8px; height: 8px; border-radius: 2px; border: 1px solid #aaa; }
  #fontCache .slot.on { background: var(--ink); border-color: var(--ink); }
  button:active { background: #e6e6e6; }
  button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  label { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  input[type=text] { font: inherit; padding: 6px 8px; width: 7em; border: 1px solid var(--line);
    border-radius: 7px; background: #fff; color: inherit; }
  input[type=range] { width: 120px; }
  main { flex: 1; display: grid; place-items: center; padding: 10px; min-height: 0; }
  /* 손가락은 화면 밀기·손가락 확대에 쓰고, 마우스로만 끌어서 선택한다 (app.js) */
  #paper { max-width: 100%; max-height: 100%; background: #fff; box-shadow: 0 2px 12px #0004;
    touch-action: manipulation; }
  /* 선택 모드에서는 손가락으로 끌어도 화면이 밀리지 않고 글자가 선택된다 */
  #paper.selecting { touch-action: none; }
  footer { padding: 6px 12px; padding-bottom: max(6px, env(safe-area-inset-bottom));
    background: var(--bar); border-top: 1px solid var(--line); min-height: 30px;
    font-size: 13px; color: #444; }
  /* 한글 조합 입력을 받는 곳. 커서 칸 위에 두어 조합 후보 창이 그 옆에 뜨게 한다.
     안드로이드 크롬은 화면 뒤에 숨은 입력칸에는 키보드를 띄우지 않는다. 그래서 화면 위에
     두되 거의 투명하게 만들고, 손가락 입력은 원고지로 통과시킨다. */
  #ime { position: fixed; opacity: 0.01; border: 0; padding: 0; margin: 0; resize: none;
    overflow: hidden; background: transparent; color: transparent; caret-color: transparent;
    z-index: 3; pointer-events: none; }
  #file { display: none; }
  @media print {
    @page { size: A4 portrait; margin: 0; }
    html, body { height: auto; background: #fff; overflow: visible; }
    header, footer, #ime { display: none !important; }
    main { display: block; padding: 0; }
    #paper { width: 210mm; height: 297mm; max-width: none; max-height: none; box-shadow: none; }
  }
</style>
</head>
<body>
<header>
  <label>이름 <input id="name" type="text" value="편지" maxlength="40"
    title="저장·인쇄할 때 쓰는 파일 이름"></label>
  <button id="open">불러오기</button>
  <button id="save">저장</button>
  <button id="print">인쇄 · PDF</button>
  <span class="sep"></span>
  <button id="keyboard" title="키보드를 올립니다">키보드</button>
  <button id="selectMode" aria-pressed="false" title="손가락으로 끌어서 글자를 선택합니다">선택</button>
  <button id="selectAll" title="전체 선택 (⌘A)">전체</button>
  <button id="copy" title="선택한 글자 복사 (⌘C)">복사</button>
  <button id="paste" title="붙여넣기 (⌘V)">붙여넣기</button>
  <button id="erase" title="선택한 글자, 없으면 그 줄 첫 칸까지 지우기 (⌘⌫)">지우기</button>
  <span class="sep"></span>
  <button id="vertical" aria-pressed="false">세로쓰기</button>
  <select id="font"></select>
  <button id="fontCache" title="저장된 글꼴 (최대 3개)" aria-label="저장된 글꼴">
    <span class="slot"></span><span class="slot"></span><span class="slot"></span>
  </button>
  <label>글자 크기 <input id="size" type="range" min="40" max="100" step="1"><span id="sizeValue">80%</span></label>
</header>
<main>
  <svg id="paper" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297"></svg>
</main>
<footer id="status">준비</footer>
<textarea id="ime" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"
  inputmode="text" enterkeyhint="enter"></textarea>
<input id="file" type="file" accept=".txt,text/plain">
<script type="module" src="app.js"></script>
</body>
</html>
